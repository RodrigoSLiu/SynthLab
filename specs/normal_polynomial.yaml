variables:
  x:
    type: continuous
  y:
    type: continuous

assumptions:
  marginals:
    - variable: x
      generator:
        name: normal
        params:
          mean: 0.0
          std: 1.0

relationships:
  - target: y
    inputs: [x]
    function:
      name: polynomial
      params:
        coefficients:
          "2": 1.5
          "1": 2.0
          "0": 0.5
    noise:
      name: normal
      params:
        mean: 0.0
        std: 0.1

validation:
  - type: distribution
    variable: x
    test: ks
    alpha: 0.05

  - type: slope
    target: y
    inputs: [x]
    expected: 2.0
    tolerance: 0.5
