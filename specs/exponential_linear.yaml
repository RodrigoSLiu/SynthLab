variables:
  x:
    type: continuous
  y:
    type: continuous

assumptions:
  marginals:
    - variable: x
      generator:
        name: exponential
        params:
          scale: 2.0

relationships:
  - target: y
    inputs: [x]
    function:
      name: linear
      params:
        coefficients:
          x: 1.5
        intercept: 0.0
    noise:
      name: normal
      params:
        mean: 0.0
        std: 0.1

validation:
  - type: distribution
    variable: x
    test: ks
    alpha: 0.05

  - type: slope
    target: y
    inputs: [x]
    expected: 1.5
    tolerance: 0.1
