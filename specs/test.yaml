variables:
  x:
    type: continuous
  y:
    type: continuous
assumptions:
  marginals:
  - variable: x
    generator:
      name: uniform
      params:
        low: 0.0
        high: 1.0
relationships:
- target: y
  inputs:
  - x
  function:
    name: linear
    params:
      coefficients:
        x: 2.0
      intercept: 0.5
  noise:
    name: normal
    params:
      mean: 0.0
      std: 0.1
validation:
- type: distribution
  variable: x
  test: ks
  alpha: 0.05
- type: slope
  target: y
  inputs:
  - x
  expected: 2.0
  tolerance: 0.1
