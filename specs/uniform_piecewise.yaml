variables:
  x:
    type: continuous
  y:
    type: continuous

assumptions:
  marginals:
    - variable: x
      generator:
        name: uniform
        params:
          low: 0.0
          high: 1.0

relationships:
  - target: y
    inputs: [x]
    function:
      name: piecewise_linear
      params:
        breakpoints: [0.3, 0.7]
        slopes: [1.0, 3.0, -2.0]
        intercepts: [0.0, -0.6, 2.0]

validation:
  - type: distribution
    variable: x
    test: ks
    alpha: 0.05

  - type: slope
    target: y
    inputs: [x]
    expected: 1.0
    tolerance: 0.5
