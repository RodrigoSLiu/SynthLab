variables:
  x:
    type: continuous
  y:
    type: continuous

assumptions:
  marginals:
    - variable: x
      generator:
        name: uniform
        params:
          low: -2.0
          high: 2.0

relationships:
  - target: y
    inputs: [x]
    function:
      name: polynomial
      params:
        coefficients:
          "3": 0.5
          "2": -1.0
          "1": 2.0
          "0": 1.0
    noise:
      name: normal
      params:
        mean: 0.0
        std: 0.1

validation:
  - type: distribution
    variable: x
    test: ks
    alpha: 0.05

  - type: slope
    target: y
    inputs: [x]
    expected: 2.0
    tolerance: 1.0
