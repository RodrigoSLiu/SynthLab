[project]
name = "synthlab"
version = "0.1.0"
description = "Generate synthetic datasets from declared statistical assumptions"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "ruff",
]